name: Issue graph

# The Guardian graph spans many repositories, so this hub relabels on a schedule rather than on its
# own issue events alone. Cross-repository writes need ISSUE_GRAPH_TOKEN (a fine-grained token with
# issues: write on every repository in scripts/issues/outline.config.ts); without it only this
# repository's issues can be relabelled.
on:
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-graph
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - run: bun scripts/issues/sync-ready.ts
        env:
          GH_TOKEN: ${{ secrets.ISSUE_GRAPH_TOKEN || github.token }}
