name: Issue graph

# The Guardian graph spans many repositories, so this hub relabels on a schedule rather than on its
# own issue events alone. Cross-repository writes need ISSUE_GRAPH_TOKEN: a classic token with only
# the public_repo scope, from an account that can triage every repository in
# scripts/issues/outline.config.ts. A fine-grained token is limited to one owner and the graph spans
# several organisations. Without the secret only this repository's issues can be relabelled.
# GitHub runs scheduled workflows best effort: the 15-minute cron has fired every 5 to 9 hours in
# practice. It is a backstop. Whoever closes an issue runs scripts/issues/sync-ready.ts (AGENTS.md).
on:
  schedule:
    - cron: '*/15 * * * *'
  issues:
    types: [closed, reopened]
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: issue-graph
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: oven-sh/setup-bun@v2
      - name: Sync readiness labels
        env:
          GH_TOKEN: ${{ secrets.ISSUE_GRAPH_TOKEN || github.token }}
          ISSUE_GRAPH_TOKEN: ${{ secrets.ISSUE_GRAPH_TOKEN }}
        run: |
          if [[ -n "$ISSUE_GRAPH_TOKEN" ]]; then
            bun scripts/issues/sync-ready.ts
          else
            echo '::warning::ISSUE_GRAPH_TOKEN is not configured. Cross-repository relabelling requires this secret with issues read and write on every participating repository. Using github.token to relabel only the hub; unavailable external blockers remain blocked.'
            bun scripts/issues/sync-ready.ts --repo "$GITHUB_REPOSITORY" --allow-unavailable-blockers
          fi
